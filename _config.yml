title: Runze Ni
#logo: /assets/img/xxx.png
#description: text below image
#show_downloads: true
repository: runzeni/runzeni.github.io

# Include hidden directories
include:
  - .well-known

# Exclude from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules

# ---------------------------------------------------------------------------
# Collections
# ---------------------------------------------------------------------------
collections:
  photobook:
    output: true
    permalink: /fotos/archive/:slug/
  modules:
    output: true
    permalink: /misc/:name/

# ---------------------------------------------------------------------------
# Default Front Matter
# ---------------------------------------------------------------------------
defaults:
  - scope:
      path: ""
      type: photobook
    values:
      layout: photobook
  - scope:
      path: ""
      type: modules
    values:
      layout: module

# ---------------------------------------------------------------------------
# Plugins (explicit for GitHub Pages)
# ---------------------------------------------------------------------------
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed