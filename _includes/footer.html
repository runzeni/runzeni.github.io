<footer class="site-footer" id="site-footer">
  <div class="footer-content">
    <p>&copy; {{ 'now' | date: '%Y' }} {{ site.data.profile.name | escape }}</p>
    <nav aria-label="Contact links">
      <button type="button" class="utility-link" data-copy-email data-copy-value="{{ site.data.profile.email | escape }}">Email</button>
      <a class="utility-link" href="{{ site.data.profile.links.scholar }}" target="_blank" rel="noopener noreferrer">Scholar</a>
      <a class="utility-link" href="{{ site.data.profile.links.github }}" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a class="utility-link" href="{{ site.data.profile.links.linkedin }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </nav>
  </div>
</footer>
