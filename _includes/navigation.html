<ul class="site-nav-list">
  {% for link in site.data.navigation %}
    {% assign active = false %}
    {% if link.url == '/' %}
      {% if page.url == '/' %}{% assign active = true %}{% endif %}
    {% elsif page.url == link.url or page.url contains link.url %}
      {% assign active = true %}
    {% endif %}
    <li class="site-nav-item{% if active %} site-nav-active{% endif %}">
      <a href="{{ link.url | relative_url }}"{% if active %} aria-current="page"{% endif %}><span class="site-nav-label">{{ link.title }}</span></a>
    </li>
  {% endfor %}
</ul>
